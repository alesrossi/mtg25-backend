name: Integration Environment CI/CD

on:
  push:
    branches: [int]
  pull_request:
    branches: [int]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: mtg-api
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and Test
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: supersecretlongpassword
          POSTGRES_USER: root
          POSTGRES_DB: test_main
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Redis CLI and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools postgresql-client

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60s bash -c 'until pg_isready -h localhost -p 5433 -U root; do sleep 2; done'
          echo "PostgreSQL is ready!"
          
          echo "Waiting for Redis..."
          timeout 30s bash -c 'until redis-cli -h localhost -p 6379 ping | grep PONG; do sleep 2; done'
          echo "Redis is ready!"

      - name: Ensure bulk-data directory
        run: |
          sudo mkdir -p /mtg25-backend/bulk-data
          sudo chown "$USER":"$USER" /mtg25-backend/bulk-data
          sudo chmod 775 /mtg25-backend/bulk-data

      - name: Run tests
        run: |
          dotnet test --no-build --configuration Release \
            --logger "trx;LogFileName=test_results.trx" \
            --logger "console;verbosity=detailed" \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/ \
            -- RunConfiguration.CollectSourceInformation=true
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: "Server=localhost;Port=5433;Database=test_main;User Id=root;Password=supersecretlongpassword;"
          ConnectionStrings__Redis: "localhost:6379"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/
          retention-days: 30

      - name: Test Report Summary
        if: always()
        run: |
          echo "## Test Results Summary 📊" >> $GITHUB_STEP_SUMMARY
          if [ -f TestResults/test_results.trx ]; then
            echo "✅ Test results file generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/int'

    outputs:
      image-tag: ${{ steps.vars.outputs.image_tag }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=int-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "image_tag=int-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=int-latest,enable=true
            type=raw,value=int-{{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build Summary
        run: |
          echo "## Docker Image Built Successfully 🐳" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
  
  deploy-hetzner:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to Hetzner
    if: github.event_name == 'push' && github.ref == 'refs/heads/int'
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/mtg
            git pull origin int
            IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }} \
              docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }} \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Health check
        run: |
          echo "Waiting 30s for API startup..."
          sleep 30
          curl -fsS https://api.surveyl.top/api/health

      - name: Debug on failure
        if: ${{ failure() }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/mtg
            echo "=== Container status ==="
            docker compose -f docker-compose.prod.yml ps
            echo "=== API logs (last 50) ==="
            docker compose -f docker-compose.prod.yml logs --tail=50 api-int

      - name: Summary
        if: success()
        run: |
          echo "## Deployed to Hetzner" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** https://api.surveyl.top" >> $GITHUB_STEP_SUMMARY
          echo "- **API Health:** https://api.surveyl.top/api/health" >> $GITHUB_STEP_SUMMARY
          echo "- **API Docs:** https://api.surveyl.top/scalar" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** https://app.surveyl.top" >> $GITHUB_STEP_SUMMARY
          echo "- **Adminer:** https://adminer.surveyl.top" >> $GITHUB_STEP_SUMMARY
