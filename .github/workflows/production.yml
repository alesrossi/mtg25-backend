name: Production Environment CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: mtg-api

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
        ports: [ '5432:5432' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger trx
    
  build-push:
      needs: build-test
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Log in to GHCR
          run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login docker.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        - name: Build image
          run: |
            IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker build -t $IMAGE .
            docker tag $IMAGE ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            echo "IMAGE=$IMAGE" >> $GITHUB_ENV
        - name: Push image
          run: |
            docker push $IMAGE
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV
      - name: Update image in manifest
        run: |
          kubectl set image deployment/mtg-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n mtg-prod
      - name: Apply manifests (for first deploy or config changes)
        run: |
          kubectl apply -k k8s/
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mtg-api -n mtg-prod --timeout=120s
      - name: Smoke test
        run: |
          curl -fsSL https://138.197.188.60/api/health
