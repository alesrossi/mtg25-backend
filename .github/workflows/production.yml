name: Production Environment CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: mtg-api
  DOTNET_VERSION: '9.0.x'

jobs:
  test:
  # ... (keep the existing test job unchanged) ...

  build-and-push:
  # ... (keep the existing build-and-push job unchanged) ...

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to DigitalOcean Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          # Create deployment directory
          mkdir -p deployment-files
          
          # Copy only the necessary files for deployment
          cp docker-compose.prd.yml deployment-files/
          cp init-db.sql deployment-files/ 2>/dev/null || echo "init-db.sql not found, skipping"
          
          # Create .env.production file with secrets
          cat > deployment-files/.env.production << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG=prod-latest
          EOF

      - name: Copy files to droplet
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          source: "deployment-files/*"
          target: "/app/mtg-api/"
          strip_components: 1

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          script: |
            # Navigate to application directory
            cd /app/mtg-api
            
            # Create bulk-data directory if it doesn't exist
            mkdir -p bulk-data
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Stop and remove existing containers
            docker compose -f docker-compose.prd.yml down || true
            
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:prod-latest
            
            # Start services with updated image
            docker compose -f docker-compose.prd.yml up -d
            
            # Clean up old images
            docker image prune -af
            
            # Wait for services to be healthy
            sleep 30
            
            # Verify deployment
            docker compose -f docker-compose.prd.yml ps

      - name: Deployment Summary
        run: |
          echo "## 🚀 Production Deployment Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Image:" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:prod-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ needs.build-and-push.outputs.image-digest }}" >> $GITHUB_STEP_SUMMARY
