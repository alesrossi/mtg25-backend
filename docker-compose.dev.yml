services:
  redis:
    image: redis:latest
    platform: linux/amd64
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_PASSWORD: supersecretlongpassword
      POSTGRES_USER: root
      POSTGRES_DB: main
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-identity-db-local.sql:/docker-entrypoint-initdb.d/init-identity-db-local.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d main"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
