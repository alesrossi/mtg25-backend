version: '3.8'

services:
  redis-int:
    image: redis:7-alpine
    container_name: redis-int
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-int-data:/data
    networks:
      - mtg-int-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-int:
    image: postgres:15-alpine
    container_name: postgres-int
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${INT_POSTGRES_PASSWORD}
      POSTGRES_USER: root
      POSTGRES_DB: main_int
    ports:
      - "5434:5432"
    volumes:
      - postgres-int-data:/var/lib/postgresql/data
      - ./scripts/init-identity-db.sql:/docker-entrypoint-initdb.d/init-identity-db.sql
    networks:
      - mtg-int-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d main_int"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-int:
    image: ${DOCKER_USERNAME:-alesrossi}/mtg-api:${IMAGE_TAG}
    container_name: api-int
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Integration
      - ConnectionStrings__DefaultConnection=Server=postgres-int;Port=5432;Database=main_int;User Id=root;Password=${INT_POSTGRES_PASSWORD};
      - ConnectionStrings__IdentityConnection=Server=postgres-int;Port=5432;Database=identity_int;User Id=root;Password=${INT_POSTGRES_PASSWORD};
      - ConnectionStrings__Redis=redis-int:6379
      - JWT__SecretKey=${INT_JWT_SECRET}
      - JWT__Issuer=MTG25API
      - JWT__Audience=MTG25Users
      - JWT__ExpiryMinutes=60
      - Scryfall__BasePath=https://api.scryfall.com/
      - Paths__Bulk=/tmp/mtg25-bulk
    depends_on:
      postgres-int:
        condition: service_healthy
      redis-int:
        condition: service_healthy
      elasticsearch-int:
        condition: service_started
    networks:
      - mtg-int-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./logs:/app/logs
      - /app/mtg-api/appsettings.Integration.json:/app/appsettings.Integration.json:ro

  adminer-int:
    image: adminer:4
    container_name: adminer-int
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres-int
    depends_on:
      - postgres-int
    networks:
      - mtg-int-network
  elasticsearch-int:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch-int
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-int-data:/usr/share/elasticsearch/data
    networks:
      - mtg-int-network
  kibana-int:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana-int
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-int:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch-int
    networks:
      - mtg-int-network
  frontend-int:
    image: ${FRONTEND_REGISTRY:-alesrossi}/mtgfe-frontend:${FRONTEND_TAG}
    container_name: frontend-int
    restart: unless-stopped
    depends_on:
      api-int:
        condition: service_started
    ports:
      - "8088:80"
  nginx-int:
    image: nginx:1.27-alpine
    container_name: nginx-int
    restart: unless-stopped
    depends_on:
      api-int:
        condition: service_started
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./scripts/nginx/int/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/nginx/int/certs:/etc/nginx/certs:ro
    networks:
      - mtg-int-network

volumes:
  redis-int-data:
    name: mtg-redis-int-data
  postgres-int-data:
    name: mtg-postgres-int-data
  es-int-data:
    name: mtg-es-int-data

networks:
  mtg-int-network:
    name: mtg-int-network
    driver: bridge
