services:
  mtg-api:
    image: ${DOCKER_USERNAME}/mtg-api:${IMAGE_TAG:-prod-latest}
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./bulk-data:/app/bulk-data
    networks:
      - mtg-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - mtg-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=root
      - HTTP_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - mtg-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: root
      POSTGRES_DB: main
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d main"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtg-network

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mtg-network

volumes:
  redis-data:
  postgres-data:

networks:
  mtg-network:
    driver: bridge