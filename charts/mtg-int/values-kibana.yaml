kibana:
  enabled: true
  replicas: 2
  elasticsearchCertificateSecret: elasticsearch-int-certs
  elasticsearchCredentialSecret: elasticsearch-int-credentials
  elasticsearchCertificateAuthoritiesFile: ca.crt
  elasticsearchHosts: "https://elasticsearch-int:9200"
