# Umbrella values for MTG integration environment

postgresql:
  fullnameOverride: postgres-int
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  pgdata: /var/lib/postgresql/data/pgdata
  auth:
    username: root
    database: main_int
    password: ""
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 10Gi
  initdb:
    configMap: postgres-int-initdb

postgres:
  external:
    enabled: false
    type: NodePort
    nodePort: 32105
    loadBalancerSourceRanges: []

redis:
  fullnameOverride: redis-int
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  command:
    - redis-server
    - --appendonly
    - "yes"
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 2Gi

elasticsearch:
  fullnameOverride: elasticsearch-int
  replicas: 1
  esConfig:
    elasticsearch.yml: |
      ingest.geoip.downloader.enabled: false
  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"
  volumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 10Gi
    storageClassName: hcloud-volumes
  extraEnvs:
    - name: ES_JAVA_OPTS
      value: "-Xms512m -Xmx512m"

kibana:
  enabled: false
  replicas: 2
  fullnameOverride: kibana-int
  elasticsearchHosts: "https://elasticsearch-int:9200"
  elasticsearchCertificateSecret: elasticsearch-int-certs
  elasticsearchCredentialSecret: elasticsearch-int-credentials
  image: "docker.io/elastic/kibana"
  imageTag: "8.5.1"
  imagePullPolicy: IfNotPresent
  preInstall:
    enabled: true
  esTokenInit:
    enabled: false
  annotations:
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  preInstallHook:
    enabled: false
  preUpgradeHook:
    enabled: false

api:
  replicas: 2
  image:
    repository: alesrossi/mtg-api
    tag: int-latest
    pullPolicy: Always
  service:
    port: 8080
  env:
    ASPNETCORE_ENVIRONMENT: Integration
    ConnectionStrings__Redis: "redis-int:6379"
    JWT__Issuer: MTG25API
    JWT__Audience: MTG25Users
    JWT__ExpiryMinutes: "60"
    Scryfall__BasePath: https://api.scryfall.com/
    Paths__Bulk: /tmp/mtg25-bulk
  extraEnv:
    - name: DOTNET_SYSTEM_NET_DISABLEIPV6
      value: "true"
    - name: DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER
      value: "0"
    - name: DOTNET_SYSTEM_NET_HTTP_DISABLEHTTP2
      value: "1"
    - name: DOTNET_SYSTEM_NET_HTTP_DISABLEHTTP3
      value: "1"
  scryfall:
    waitForBasePath: true
    waitImage: curlimages/curl:8.8.0
    retrySeconds: 5
    prefetch:
      enabled: false
      image: python:3.12-alpine
  persistence:
    logs:
      enabled: false
      storageClass: hcloud-volumes
      size: 5Gi
    bulkData:
      enabled: false
      storageClass: hcloud-volumes
      size: 5Gi
  config:
    appsettingsIntegrationConfigMap: api-int-appsettings
    manageAppsettingsConfigMap: false
  elasticsearch:
    caSecretName: elasticsearch-int-certs
    caSecretKey: ca.crt
    caMountPath: /app/certs/elastic-ca.crt
    credentialsSecretName: elasticsearch-int-credentials
    credentialsUsernameKey: username
    credentialsPasswordKey: password
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - api-int
          topologyKey: "kubernetes.io/hostname"
 
frontend:
  replicas: 2
  image:
    repository: alesrossi/mtgfe-frontend
    tag: latest
    pullPolicy: Always
  service:
    port: 80

adminer:
  image:
    repository: adminer
    tag: "4"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  env:
    ADMINER_DEFAULT_SERVER: postgres-int

nginx:
  replicas: 2
  image:
    repository: nginx
    tag: 1.27-alpine
    pullPolicy: IfNotPresent
  service:
    ports:
      http: 80
      https: 443
  config:
    nginxConfigMap: nginx-int-config
    certsSecret: nginx-int-certs
  certs:
    enabled: false

ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []

certManager:
  enabled: false
  issuerName: ""
  email: ""
  server: ""

maintenance:
  restartCron:
    enabled: false
    schedule: "0 3 * * *"
    timeZone: "UTC"
    image: "registry.k8s.io/kubectl:v1.30.3"
    deployments:
      - api-int
      - frontend-int
      - nginx-int
      - adminer-int

loggingRetention:
  enabled: false
  elasticsearchHost: "https://elasticsearch-int:9200"
  policyName: "mtg25-api-int-ilm"
  templateName: "mtg25-api-int-template"
  indexPattern: "mtg25-api-int-*"
  deleteAfterDays: 180
  manageScriptConfigMap: true
  scriptConfigMapName: "mtg-int-ilm-script"
  scriptFileName: "ilm-setup.sh"
