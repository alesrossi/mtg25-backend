apiVersion: v1
kind: Service
metadata:
  name: nginx-int
spec:
  selector:
    app: nginx-int
  ports:
    - name: http
      port: {{ .Values.nginx.service.ports.http }}
      targetPort: {{ .Values.nginx.service.ports.http }}
    - name: https
      port: {{ .Values.nginx.service.ports.https }}
      targetPort: {{ .Values.nginx.service.ports.https }}
  type: ClusterIP
