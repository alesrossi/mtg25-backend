{{- $privacy := default dict .Values.privacySite -}}
{{- if (default false (get $privacy "enabled")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: privacy-int-content
data:
  index.html: |
{{ .Files.Get "files/privacy/index.html" | nindent 4 }}
  styles.css: |
{{ .Files.Get "files/privacy/styles.css" | nindent 4 }}
{{- end }}
