apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-int
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.api.replicas | default 1 }}
  selector:
    matchLabels:
      app: api-int
  template:
    metadata:
      labels:
        app: api-int
    spec:
      {{- if .Values.api.affinity }}
      affinity:
{{ toYaml .Values.api.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.api.scryfall.waitForBasePath }}
      initContainers:
        - name: wait-for-scryfall
          image: "{{ .Values.api.scryfall.waitImage }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for Scryfall at {{ .Values.api.env.Scryfall__BasePath }}..."
              while true; do
                code=$(curl -sS -o /dev/null -w "%{http_code}" "{{ .Values.api.env.Scryfall__BasePath }}")
                if [ "$code" != "000" ]; then
                  exit 0
                fi
                sleep {{ .Values.api.scryfall.retrySeconds }}
              done
{{- if .Values.api.scryfall.prefetch.enabled }}
        - name: scryfall-prefetch
          image: "{{ .Values.api.scryfall.prefetch.image }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /app/bulk-data
              python - <<'PY'
              import datetime
              import json
              import os
              import urllib.request

              base = "https://api.scryfall.com/"
              bulk_url = base + "bulk-data/default_cards"
              with urllib.request.urlopen(bulk_url) as response:
                  bulk = json.load(response)
              download_url = bulk["download_uri"]
              target_dir = "/app/bulk-data"
              os.makedirs(target_dir, exist_ok=True)
              file_name = datetime.date.today().strftime("%Y%m%d") + ".json"
              dest = os.path.join(target_dir, file_name)
              if not os.path.exists(dest):
                  with urllib.request.urlopen(download_url) as response:
                      with open(dest, "wb") as handle:
                          handle.write(response.read())
              print(f"Downloaded Scryfall bulk data to {dest}")
              PY
          volumeMounts:
            - name: bulk-data
              mountPath: /app/bulk-data
{{- end }}
      {{- end }}
      containers:
        - name: api-int
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "{{ .Values.api.env.ASPNETCORE_ENVIRONMENT }}"
            - name: ConnectionStrings__Redis
              value: "{{ .Values.api.env.ConnectionStrings__Redis }}"
            - name: JWT__Issuer
              value: "{{ .Values.api.env.JWT__Issuer }}"
            - name: JWT__Audience
              value: "{{ .Values.api.env.JWT__Audience }}"
            - name: JWT__ExpiryMinutes
              value: "{{ .Values.api.env.JWT__ExpiryMinutes }}"
            - name: Scryfall__BasePath
              value: "{{ .Values.api.env.Scryfall__BasePath }}"
            - name: Paths__Bulk
              value: "{{ .Values.api.env.Paths__Bulk }}"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: api-int-secrets
                  key: connectionStringsDefault
            - name: ConnectionStrings__IdentityConnection
              valueFrom:
                secretKeyRef:
                  name: api-int-secrets
                  key: connectionStringsIdentity
            - name: JWT__SecretKey
              valueFrom:
                secretKeyRef:
                  name: api-int-secrets
                  key: jwtSecret
            - name: ElasticsearchLogging__Username
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.elasticsearch.credentialsSecretName }}
                  key: {{ .Values.api.elasticsearch.credentialsUsernameKey }}
            - name: ElasticsearchLogging__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.elasticsearch.credentialsSecretName }}
                  key: {{ .Values.api.elasticsearch.credentialsPasswordKey }}
            - name: SerilogSelfLog__Enabled
              value: "true"
{{- if .Values.api.extraEnv }}
{{ toYaml .Values.api.extraEnv | indent 12 }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: appsettings
              mountPath: /app/appsettings.Integration.json
              subPath: appsettings.Integration.json
            - name: elasticsearch-certs
              mountPath: {{ .Values.api.elasticsearch.caMountPath }}
              subPath: elastic-ca.crt
              readOnly: true
{{- if .Values.api.persistence.logs.enabled }}
            - name: logs
              mountPath: /app/logs
{{- end }}
            - name: bulk-data
              mountPath: /app/bulk-data
      volumes:
        - name: appsettings
          configMap:
            name: {{ .Values.api.config.appsettingsIntegrationConfigMap }}
        - name: elasticsearch-certs
          secret:
            secretName: {{ .Values.api.elasticsearch.caSecretName }}
            items:
              - key: {{ .Values.api.elasticsearch.caSecretKey }}
                path: elastic-ca.crt
{{- if .Values.api.persistence.logs.enabled }}
        - name: logs
          persistentVolumeClaim:
            claimName: api-int-logs
{{- end }}
        - name: bulk-data
{{- if .Values.api.persistence.bulkData.enabled }}
          persistentVolumeClaim:
            claimName: api-int-bulk-data
{{- else }}
          emptyDir: {}
{{- end }}
