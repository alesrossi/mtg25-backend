{{- if and .Values.elk.enabled .Values.kibana.enabled (not .Values.kibana.preInstall.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: kibana-int-es-token
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: mtg-int
    meta.helm.sh/release-namespace: integration
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  token: {{ .Values.kibana.esToken | default "placeholder" | quote }}
{{- end }}
