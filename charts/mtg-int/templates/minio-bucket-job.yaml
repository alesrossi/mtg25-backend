{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-int-create-bucket
  labels:
    app: minio-int
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: minio-int
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecretName }}
                  key: {{ .Values.minio.credentialsAccessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecretName }}
                  key: {{ .Values.minio.credentialsSecretKeyKey }}
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set local http://minio-int:{{ .Values.minio.service.apiPort }} "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO..."
                sleep 3
              done
              mc mb --ignore-existing "local/{{ .Values.minio.bucket }}"
{{- end }}
