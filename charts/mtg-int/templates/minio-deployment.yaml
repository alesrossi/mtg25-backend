{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-int
  labels:
    app: minio-int
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-int
  template:
    metadata:
      labels:
        app: minio-int
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.minio.service.consolePort }}"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecretName }}
                  key: {{ .Values.minio.credentialsAccessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecretName }}
                  key: {{ .Values.minio.credentialsSecretKeyKey }}
          ports:
            - name: api
              containerPort: {{ .Values.minio.service.apiPort }}
            - name: console
              containerPort: {{ .Values.minio.service.consolePort }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ .Values.minio.service.apiPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.minio.service.apiPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
{{- if and .Values.minio.persistence.enabled .Values.minio.persistence.storageClass }}
          persistentVolumeClaim:
            claimName: minio-int-data
{{- else }}
          emptyDir: {}
{{- end }}
{{- end }}
