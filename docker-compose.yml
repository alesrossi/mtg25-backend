services:
  
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=root
      - HTTP_PASSWORD=supersecretlongpassword
    ports:
      - 8081:8081
    depends_on:
      - redis

  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: supersecretlongpassword
      POSTGRES_USER: root
      POSTGRES_DB: main
    ports:
      - 5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d main"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  adminer:
    image: adminer
    restart: always
    ports:
      - 8089:8080
    depends_on:
      postgres:
        condition: service_healthy
  

volumes:
  redis-data:
  postgres-data: