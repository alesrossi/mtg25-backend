services:
  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: supersecretlongpassword
      POSTGRES_USER: root
      POSTGRES_DB: main
    ports:
      - 5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d main"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=main;Username=root;Password=supersecretlongpassword
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data: