services:

  api:
    image: alesrossi/mtg25-backend:latest
    build:
      context: .
      dockerfile: API/Dockerfile
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=postgres;Username=root;Password=supersecretlongpassword

  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: supersecretlongpassword
      POSTGRES_USER: root
    ports:
      - 5433:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

volumes:
  redis-data:
